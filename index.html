<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DFC Fixtures</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f7f7f7;
      color: #222;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 1rem;
    }
    h1 {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .tabs {
      display: flex;
      border-bottom: 2px solid #ddd;
      margin-bottom: 1rem;
    }
    .tab {
      flex: 1;
      text-align: center;
      padding: 0.75rem 0;
      cursor: pointer;
      background: #eee;
      border: none;
      outline: none;
      font-size: 1rem;
      transition: background 0.2s;
    }
    .tab.active {
      background: #fff;
      border-bottom: 2px solid #007bff;
      color: #007bff;
      font-weight: bold;
    }
    .fixtures {
      display: none;
    }
    .fixtures.active {
      display: block;
    }
    .fixture-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .fixture {
      display: flex;
      flex-direction: column;
      background: #fff;
      margin-bottom: 1rem;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      padding: 1rem;
      border-left: 6px solid #ccc;
      transition: border-color 0.2s;
    }
    .fixture.home {
      border-left-color: #4caf50;
      background: #eafbe7;
    }
    .fixture.away {
      border-left-color: #2196f3;
      background: #e7f1fb;
    }
    .fixture .date {
      font-weight: bold;
      margin-bottom: 0.25rem;
    }
    .fixture .opponent, .fixture .venue {
      margin-bottom: 0.25rem;
    }
    .date-separator {
      text-align: center;
      margin: 1.5rem 0;
      position: relative;
    }
    .date-separator::before,
    .date-separator::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 30%;
      height: 1px;
      background: #ddd;
    }
    .date-separator::before {
      left: 0;
    }
    .date-separator::after {
      right: 0;
    }
    .date-separator span {
      background: #f7f7f7;
      padding: 0 1rem;
      position: relative;
      z-index: 1;
      color: #666;
      font-weight: bold;
    }
    @media (max-width: 600px) {
      .container {
        padding: 0.5rem;
      }
      .fixture {
        padding: 0.75rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>DFC Fixtures</h1>
    <div class="tabs">
      <button class="tab active" id="tab-u10">U10 B Orange</button>
      <button class="tab" id="tab-u14">U14 A</button>
      <button class="tab" id="tab-combined">All Fixtures</button>
    </div>
    <div class="fixtures active" id="fixtures-u10">
      <ul class="fixture-list" id="list-u10"></ul>
    </div>
    <div class="fixtures" id="fixtures-u14">
      <ul class="fixture-list" id="list-u14"></ul>
    </div>
    <div class="fixtures" id="fixtures-combined">
      <ul class="fixture-list" id="list-combined"></ul>
    </div>
  </div>
  <script>
    // Helper: parse date string to Date object (for both formats)
    function parseFixtureDate(dateStr) {
      // Try dd/mm/yy
      if (/\d{2}\/\d{2}\/\d{2}/.test(dateStr)) {
        const [d, m, y] = dateStr.split('/');
        return new Date(`20${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`);
      }
      // Try '5 April '25
      const match = dateStr.match(/(\d{1,2}) ([A-Za-z]+) '?(\d{2})/);
      if (match) {
        const [_, day, month, year] = match;
        const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
        const monthIdx = months.findIndex(m => m.toLowerCase() === month.toLowerCase());
        if (monthIdx !== -1) {
          return new Date(2000 + parseInt(year), monthIdx, parseInt(day));
        }
      }
      return new Date(dateStr); // fallback
    }

    // Helper: is fixture in the future (today or later)
    function isFutureFixture(dateStr) {
      const fixtureDate = parseFixtureDate(dateStr);
      const today = new Date();
      today.setHours(0,0,0,0);
      return fixtureDate >= today;
    }

    // Tab switching
    document.getElementById('tab-u10').onclick = function() {
      document.getElementById('tab-u10').classList.add('active');
      document.getElementById('tab-u14').classList.remove('active');
      document.getElementById('tab-combined').classList.remove('active');
      document.getElementById('fixtures-u10').classList.add('active');
      document.getElementById('fixtures-u14').classList.remove('active');
      document.getElementById('fixtures-combined').classList.remove('active');
    };
    document.getElementById('tab-u14').onclick = function() {
      document.getElementById('tab-u14').classList.add('active');
      document.getElementById('tab-u10').classList.remove('active');
      document.getElementById('tab-combined').classList.remove('active');
      document.getElementById('fixtures-u14').classList.add('active');
      document.getElementById('fixtures-u10').classList.remove('active');
      document.getElementById('fixtures-combined').classList.remove('active');
    };
    document.getElementById('tab-combined').onclick = function() {
      document.getElementById('tab-combined').classList.add('active');
      document.getElementById('tab-u10').classList.remove('active');
      document.getElementById('tab-u14').classList.remove('active');
      document.getElementById('fixtures-combined').classList.add('active');
      document.getElementById('fixtures-u10').classList.remove('active');
      document.getElementById('fixtures-u14').classList.remove('active');
    };

    // Embedded JSON data

      {"date": "20 September '25", "time": "09:30", "home_team": "M2-01- De Beers", "away_team": "M2-02- Durbanville", "venue": "De Beers Somerset West A"},
      {"date": "24 September '25", "time": "09:30", "home_team": "M2-02- Durbanville", "away_team": "M2-03- Edgemead G/W", "venue": "Durbanville Klazinga Park A"}

    // Load and render fixtures
    function renderU10(fixtures) {
      const list = document.getElementById('list-u10');
      list.innerHTML = '';
      fixtures.filter(f => isFutureFixture(f.date)).forEach(f => {
        const li = document.createElement('li');
        li.className = 'fixture ' + (f.location === 'home' ? 'home' : 'away');
        li.innerHTML = `
          <span class="date">${f.date}</span>
          <span class="opponent"><strong>Opponent:</strong> ${f.opponent}</span>
          <span class="location"><strong>Location:</strong> ${f.location.charAt(0).toUpperCase() + f.location.slice(1)}</span>
        `;
        list.appendChild(li);
      });
    }

    function renderU14(fixtures) {
      const list = document.getElementById('list-u14');
      list.innerHTML = '';
      fixtures.filter(f => isFutureFixture(f.date)).forEach(f => {
        // Home if venue is Durbanville Klazinga Park A
        const isHome = f.venue === 'Durbanville Klazinga Park A';
        // Skip "Bye" games
        if (f.venue === 'Bye') return;
        li = document.createElement('li');
        li.className = 'fixture ' + (isHome ? 'home' : 'away');
        li.innerHTML = `
          <span class="date">${f.date}${f.time ? ' ' + f.time : ''}</span>
          <span class="opponent"><strong>${isHome ? 'Vs' : 'At'}:</strong> ${isHome ? f.away_team : f.home_team}</span>
          <span class="venue"><strong>Venue:</strong> ${f.venue}</span>
        `;
        list.appendChild(li);
      });
    }

    function renderCombined(u10Fixtures, u14Fixtures) {
      const list = document.getElementById('list-combined');
      list.innerHTML = '';
      
      // Combine and sort all fixtures
      const allFixtures = [];
      
      // Process U10 fixtures
      u10Fixtures.filter(f => isFutureFixture(f.date)).forEach(f => {
        allFixtures.push({
          date: f.date,
          team: 'U10 B Orange',
          isHome: f.location === 'home',
          opponent: f.opponent,
          location: f.location,
          time: null
        });
      });

      // Process U14 fixtures
      u14Fixtures.filter(f => isFutureFixture(f.date)).forEach(f => {
        if (f.venue === 'Bye') return;
        const isHome = f.venue === 'Durbanville Klazinga Park A';
        allFixtures.push({
          date: f.date,
          team: 'U14 A',
          isHome: isHome,
          opponent: isHome ? f.away_team : f.home_team,
          venue: f.venue,
          time: f.time
        });
      });

      // Sort all fixtures by date
      allFixtures.sort((a, b) => {
        const dateA = parseFixtureDate(a.date);
        const dateB = parseFixtureDate(b.date);
        return dateA - dateB;
      });

      // Render fixtures with date separators
      let currentDate = null;
      allFixtures.forEach(f => {
        // Add date separator if date has changed
        if (currentDate !== f.date) {
          currentDate = f.date;
          const separator = document.createElement('div');
          separator.className = 'date-separator';
          separator.innerHTML = `<span>${f.date}</span>`;
          list.appendChild(separator);
        }

        const li = document.createElement('li');
        li.className = 'fixture ' + (f.isHome ? 'home' : 'away');
        
        if (f.team === 'U10 B Orange') {
          li.innerHTML = `
            <span class="team"><strong>Team:</strong> ${f.team}</span>
            <span class="opponent"><strong>Opponent:</strong> ${f.opponent}</span>
            <span class="location"><strong>Location:</strong> ${f.location.charAt(0).toUpperCase() + f.location.slice(1)}</span>
          `;
        } else {
          li.innerHTML = `
            <span class="team"><strong>Team:</strong> ${f.team}</span>
            <span class="opponent"><strong>${f.isHome ? 'Vs' : 'At'}:</strong> ${f.opponent}</span>
            <span class="venue"><strong>Venue:</strong> ${f.venue}</span>
            ${f.time ? `<span class="time"><strong>Time:</strong> ${f.time}</span>` : ''}
          `;
        }
        
        list.appendChild(li);
      });
    }

    renderU14(u14Fixtures);
    renderCombined(u10Fixtures, u14Fixtures);
  </script>
</body>
</html>
